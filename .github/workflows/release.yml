# 打标签即发版：类型检查 + 测试 + 构建扩展（dist/ 打包成 zip 挂到 GitHub Release）
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package extension
        run: cd dist && zip -r "../loupe-${GITHUB_REF_NAME}.zip" .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: loupe-*.zip
          generate_release_notes: true
