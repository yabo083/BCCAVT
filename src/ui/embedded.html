<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loupe · 评论区</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%3Crect%20width=%2232%22%20height=%2232%22%20rx=%227%22%20fill=%22rgb(15,111,216)%22/%3E%3Cpath%20d=%22M8%208.5h16a1.5%201.5%200%200%201%201.5%201.5v9A1.5%201.5%200%200%201%2024%2020.5h-6.6L12%2024.4v-3.9H8A1.5%201.5%200%200%201%206.5%2019v-9A1.5%201.5%200%200%201%208%208.5z%22%20fill=%22rgb(255,255,255)%22/%3E%3Cg%20fill=%22rgb(15,111,216)%22%3E%3Crect%20x=%2210%22%20y=%2211.4%22%20width=%2212%22%20height=%221.7%22%20rx=%220.85%22/%3E%3Crect%20x=%2210%22%20y=%2214.6%22%20width=%228%22%20height=%221.7%22%20rx=%220.85%22/%3E%3Crect%20x=%2210%22%20y=%2217.8%22%20width=%224.5%22%20height=%221.7%22%20rx=%220.85%22/%3E%3C/g%3E%3C/svg%3E"
    />
    <style>
      /* 页面替换模式：iframe 高度由内容脚本按内容高度设定（见 READER_HEIGHT），滚动交给宿主页面，
         因此本文档自身绝不出现滚动条（横向也不出现：长链接不会把页面撑宽）。 */
      html,
      body {
        overflow: hidden;
      }
      /* 底色同样不自己画：这一层是宿主页面里的 iframe，透明才能让 B 站评论区自己的底色透上来——
         浅色 / 深色 / 站点以后换主题都与站点同色（组件的 .reader 也一并透明）。
         写成 `html body` 是为了盖过 base.css 里 `body { background: var(--bg) }`：内联样式块先于打包
         CSS 注入，只靠同权重排不出先后。 */
      html body {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <!-- 由内容脚本 page-reader 以 iframe 嵌入 B 站视频页，替换原生评论区；不是可直接打开的页面。 -->
    <div id="app"></div>
    <script type="module" src="./embedded.ts"></script>
  </body>
</html>
